spring.application.name=search-engine-backend
server.port=${PORT:8080}

# Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/searchengine_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
serper.api.key=${SERPER_API_KEY:}
serper.api.url=https://google.serper.dev/search

# Serper API
serper.api.base-url=${SERPER_API_BASE_URL:https://google.serper.dev}
serper.api.key=${SERPER_API_KEY:}

# Admin password
security.admin.password=${SECURITY_ADMIN_PASSWORD:admin123}

# JWT token auth
security.jwt.secret=${SECURITY_JWT_SECRET:replace-with-strong-secret}
security.jwt.expiration-ms=${SECURITY_JWT_EXPIRATION_MS:86400000}
security.jwt.refresh-expiration-ms=${SECURITY_JWT_REFRESH_EXPIRATION_MS:604800000}
