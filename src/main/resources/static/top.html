<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Top Queries</title>
    <link rel="stylesheet" href="/styles.css?v=2" />
  </head>
  <body class="history-page">
    <main class="app">
      <header class="header">
        <div class="brand">Top Queries</div>
        <div class="header-links">
          <a class="history-link" href="/">Search</a>
          <a class="history-link" href="/history.html">History</a>
          <a class="history-link" href="/stored.html">Stored Results</a>
        </div>

        <div class="history-header">
          <div>
            <div class="history-title">Most searched terms</div>
            <div class="history-subtitle">Updated from analytics.</div>
          </div>
          <button id="refreshTopBtn" type="button" class="ghost">Refresh</button>
        </div>
        <div id="topQueriesList" class="top-list"></div>
      </section>
    </main>

    <script src="/top.js?v=1"></script>
  </body>
