<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stored Results</title>
    <link rel="stylesheet" href="/styles.css?v=2" />
  </head>
  <body class="history-page">
    <main class="app">
      <header class="header">
        <div class="brand">Stored Results</div>
        <div class="header-links">
          <a class="history-link" href="/">Search</a>
          <a class="history-link" href="/history.html">History</a>
          <a class="history-link" href="/top.html">Top Queries</a>
        </div>
        <div class="subtitle">Fetch and manage saved results.</div>
      </header>

      <section class="panel">
        <div class="history-header">
          <div>
            <div class="history-title">Stored results</div>
            <div class="history-subtitle">Load by query, update scores, or delete.</div>
          </div>
        </div>
        <div class="history-toolbar">
          <input
            id="storedResultsQueryInput"
            type="text"
            placeholder="Query text (e.g. hi)"
          />
          <button id="loadStoredResultsBtn" type="button" class="ghost">
            Load results
          </button>
          <button id="deleteStoredResultsBtn" type="button" class="ghost danger">
            Delete results
          </button>
        </div>
        <div id="storedResultsList" class="stored-results"></div>
      </section>
    </main>

    <script src="/stored.js?v=1"></script>
  </body>
</html>
