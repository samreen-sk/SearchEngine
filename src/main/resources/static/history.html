<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search History</title>
    <link rel="stylesheet" href="/styles.css?v=7" />
  </head>
  <body class="history-page">
    <main class="app">
      <header class="header">
        <div class="brand">Search History</div>
        <div class="header-links">
          <a class="history-link" href="/">Search</a>
          <a class="history-link" href="/top.html">Top Queries</a>
          <a class="history-link" href="/stored.html">Stored Results</a>
          <button id="logoutBtn" type="button" class="history-link">Logout</button>
        </div>
        <div class="subtitle">All queries saved in MySQL</div>
      </header>

      <section class="panel">
        <div class="history-header">
          <div>
            <div class="history-title">Search history</div>
            <div class="history-subtitle">Tap a query to run it again.</div>
          </div>
          <div class="history-actions">
            <button id="refreshHistoryBtn" type="button" class="ghost">Refresh</button>
          </div>
        </div>
        <div class="history-toolbar">
          <input
            id="deleteHistoryQueryInput"
            type="text"
            placeholder="Delete history by query text"
          />
          <button id="deleteHistoryQueryBtn" type="button" class="ghost danger">
            Delete query history
          </button>
        </div>
        <div id="historyList" class="history-list"></div>
      </section>

    </main>

    <script src="/nav.js?v=6"></script>
    <script src="/history.js?v=7"></script>
  </body>
</html>
